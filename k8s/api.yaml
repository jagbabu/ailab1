apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-demo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-demo-api
  template:
    metadata:
      labels:
        app: ai-demo-api
    spec:
      containers:
        - name: ai-demo-api
          image: ai-demo-api:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ai-demo-api
spec:
  selector:
    app: ai-demo-api
  ports:
    - port: 80
      targetPort: 8000